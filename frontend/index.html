<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard Vis</title>
</head>
<body>
    <div class="page" style="opacity: 0">
        <div class="header-panel">
            <div class="panel-controls">
                <span class="frontier-label">Frontiers:</span>
                <div id="frontier-buttons"></div>
            </div>
        </div>
        <div class="layout">
            <div class="table-panel">
                <div class="panel-header">
                    <h2>Objectives Space</h2>
                    <div class="panel-controls">
                        <button id="objectives-spread" class="hidden" type="button">Spread</button>
                        <label for="objectives-chart-select">Chart:</label>
                        <select id="objectives-chart-select"></select>
                        <button id="objectives-clear-selection" class="hidden" type="button">Clear Selection</button>
                        <button id="objectives-zoom-toggle" class="hidden" type="button">Zoom In</button>
                        <div class="options-dropdown hidden" id="objectives-options-dropdown">
                            <button type="button" class="options-dropdown-btn">Options ▾</button>
                            <div class="options-dropdown-menu">
                                <button id="objectives-pca-toggle" type="button" class="options-dropdown-item">Dim. Reduction</button>
                                <button id="objectives-labels-toggle" type="button" class="options-dropdown-item">Labels</button>
                                <button id="objectives-dec-groups-toggle" type="button" class="options-dropdown-item">Dec. Groups</button>
                                <button id="objectives-frontier-colors-toggle" type="button" class="options-dropdown-item">Frontier Colours</button>
                                <button id="objectives-surface-toggle" type="button" class="options-dropdown-item">Surface</button>
                                <button id="objectives-ideal-toggle" type="button" class="options-dropdown-item">Ideal Point</button>
                                <button id="objectives-dominated-toggle" type="button" class="options-dropdown-item">Dominated</button>
                            </div>
                        </div>
                        <label for="objectives-x-axis" class="axis-label hidden">X:</label>
                        <select id="objectives-x-axis" class="hidden"></select>
                        <label for="objectives-y-axis" class="axis-label hidden">Y:</label>
                        <select id="objectives-y-axis" class="hidden"></select>
                        <label for="objectives-z-axis" class="axis-label hidden">Z:</label>
                        <select id="objectives-z-axis" class="hidden"></select>
                    </div>
                </div>
                <div id="objectives-container" class="panel-content"></div>
            </div>
            <div class="table-panel">
                <div class="panel-header">
                    <h2>Decision Space</h2>
                    <div class="panel-controls">
                        <label for="decision-chart-select">Chart:</label>
                        <select id="decision-chart-select"></select>
                        <label for="decision-x-axis" class="axis-label hidden">X:</label>
                        <select id="decision-x-axis" class="hidden"></select>
                        <label for="decision-y-axis" class="axis-label hidden">Y:</label>
                        <select id="decision-y-axis" class="hidden"></select>
                    </div>
                </div>
                <div id="decision-container" class="panel-content"></div>
            </div>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>
</html>
