services:
  - type: web
    name: high_dim_survey
    runtime: python
    buildCommand: cd frontend && npm install && npm run build && cd .. && pip install -r requirements.txt
    startCommand: gunicorn app:app
    plan: free

    envVars:
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        value: vlad12vranceanu@gmail.com
      - key: SMTP_PASSWORD
        sync: false
      - key: NOTIFY_EMAIL
        value: vlad12vranceanu@gmail.com
